#Aqui se configuran los contenedores
services:
  calculator:
    image: calculator:v1.0.1
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: exu2-calculadora
    ports:
      - "80:80"
    networks:
      - exu2-aao-net
  operations:
    image: operations:v1.0.1
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: exu2-operaciones
    ports:
      - "8081:8080"
    networks:
      - exu2-aao-net
    depends_on:
      - calculator

#Aquí se configuran las redes donde se comunican los contenedores
#docker network create --driver bridge adj-net
networks:
  exu2-aao-net:
    external: true
